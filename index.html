<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d18"><title>LINKX — Shortlink Resolver</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#17243b 0,#090d18 58%);color:#edf4ff;font:15px system-ui,sans-serif;display:grid;place-items:center;padding:22px}.wrap{width:min(100%,560px)}.brand{font-weight:800;letter-spacing:2px;font-size:20px}.panel{margin-top:24px;background:#111827;border:1px solid #27364d;border-radius:24px;padding:26px}.eyebrow{color:#60c8fa;text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:800}.title{font-size:30px;margin:8px 0}.sub,.foot{color:#9aa9bd;line-height:1.6}label{display:block;margin-bottom:9px}input{width:100%;border:1px solid #34445d;background:#0a1220;color:white;border-radius:13px;padding:15px;font-size:15px}button{width:100%;border:0;border-radius:13px;padding:15px;margin-top:12px;background:linear-gradient(90deg,#38bdf8,#6366f1);font-weight:800}.message{display:none;margin-top:18px;padding:14px;border-radius:13px;background:#0a1220;overflow-wrap:anywhere}.message.show{display:block}.error{color:#fca5a5}.success{color:#86efac}.result{display:block;color:#7dd3fc;margin-top:8px;overflow-wrap:anywhere}.copy{background:#24364f;color:white}.foot{text-align:center;font-size:12px;margin:18px 8px}</style></head><body><main class="wrap"><div class="brand">↗ LINKX</div><section class="panel"><div class="eyebrow">HTTP redirect checker</div><h1 class="title">Shortlink Resolver</h1><p class="sub">Periksa tujuan akhir shortlink melalui redirect HTTP yang dapat diakses publik.</p><form id="form"><label for="url">Masukkan URL shortlink</label><input id="url" type="url" placeholder="https://short.link/xxxxx" required maxlength="2048"><button id="submit">Periksa Link</button></form><div id="message" class="message" aria-live="polite"></div></section><p class="foot">Hanya memeriksa redirect HTTP/HTTPS. CAPTCHA, login, survei, interaksi iklan, dan proteksi akses tidak dilewati.</p></main><script>const f=document.getElementById("form"),u=document.getElementById("url"),b=document.getElementById("submit"),m=document.getElementById("message");f.addEventListener("submit",async e=>{e.preventDefault();m.className="message show";m.textContent="Memeriksa redirect…";b.disabled=true;try{const r=await fetch("/api/resolve",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url:u.value.trim()})}),d=await r.json();if(!r.ok)throw Error(d.error||"Gagal");m.innerHTML="";const h=document.createElement("strong");h.className="success";h.textContent="Tujuan akhir ditemukan";const a=document.createElement("a");a.className="result";a.href=d.finalUrl;a.target="_blank";a.rel="noopener noreferrer";a.textContent=d.finalUrl;const c=document.createElement("button");c.className="copy";c.textContent="Salin URL tujuan";c.onclick=async()=>{try{await navigator.clipboard.writeText(d.finalUrl);c.textContent="Tersalin!"}catch{c.textContent="Clipboard tidak tersedia"}};m.append(h,a,c)}catch(x){m.textContent=x.message;m.className="message show error"}finally{b.disabled=false}});</script></body></html>
